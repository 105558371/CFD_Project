% ============================================================
% SU2 config: sounding rocket, HALF-MODEL, inviscid (Euler)
% Conventions: nose at x=0, flow along +x, symmetry plane y=0,
% AoA rotates the freestream in the x-z plane (pitch plane).
% Mesh marker names must match: rocket, symmetry, farfield
% ============================================================

% ---------- Problem ----------
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
SYSTEM_MEASUREMENTS= SI

% ---------- Freestream (sea-level ISA) ----------
MACH_NUMBER= 0.8
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15
FLUID_MODEL= STANDARD_AIR

% ---------- Reference values ----------
% HALF-MODEL: REF_AREA = 0.5 * (pi * D^2 / 4), D = 0.1 m
% (SU2 only integrates forces on the modelled half, so halving the
%  area gives full-body CD, CL, CMy. Use full area for a full model.)
REF_AREA= 0.00392699
REF_LENGTH= 0.1
REF_ORIGIN_MOMENT_X= 0.72
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0

% ---------- Boundary conditions ----------
MARKER_EULER= ( rocket )
MARKER_SYM= ( symmetry )
MARKER_FAR= ( farfield )
MARKER_MONITORING= ( rocket )
MARKER_PLOTTING= ( rocket )

% ---------- Numerics ----------
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= JST
JST_SENSOR_COEFF= ( 0.5, 0.02 )
% For sharper shocks later, try:
% CONV_NUM_METHOD_FLOW= ROE
% MUSCL_FLOW= YES
% SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
TIME_DISCRE_FLOW= EULER_IMPLICIT

CFL_NUMBER= 5.0
CFL_ADAPT= YES
% ( factor down, factor up, CFL min, CFL max )
CFL_ADAPT_PARAM= ( 0.5, 1.2, 1.0, 100.0 )

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10

% ---------- Convergence ----------
ITER= 3000
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -8
CONV_STARTITER= 10

% ---------- I/O ----------
MESH_FILENAME= rocket.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= solution_flow
RESTART_FILENAME= restart_flow
CONV_FILENAME= history
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_PARAVIEW )
OUTPUT_WRT_FREQ= 500

% ============================================================
% To switch to RANS (viscous), replace the Euler pieces with:
%   SOLVER= RANS
%   KIND_TURB_MODEL= SA
%   VISCOSITY_MODEL= SUTHERLAND
%   MARKER_HEATFLUX= ( rocket, 0.0 )      % instead of MARKER_EULER
%   Mesh needs boundary-layer cells (y+ ~ 1).
% ============================================================
